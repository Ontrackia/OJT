name: OnTrackIA OJT V2.0 - Deploy to Hetzner

# DISABLED: Auto-deployment disabled until server is configured
# Enable after completing manual deployment with deploy_hetzner.sh
on:
  # push:
  #     branches:
  #         - main
  workflow_dispatch: # Manual trigger only

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts

      - name: Deploy to Hetzner
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST << 'ENDSSH'
            # Colores para logs
            RED='\033[0;31m'
            GREEN='\033[0;32m'
            YELLOW='\033[1;33m'
            NC='\033[0m'
            
            echo -e "${GREEN}========================================${NC}"
            echo -e "${GREEN}OnTrackIA OJT V2.0 - Auto Deployment${NC}"
            echo -e "${GREEN}========================================${NC}"
            
            # Navegar al directorio del proyecto
            cd /opt/ontrackia/OJT || exit 1
            
            # Guardar hash actual
            OLD_HASH=$(git rev-parse HEAD)
            
            # Pull latest changes
            echo -e "\n${YELLOW}📥 Pulling latest changes...${NC}"
            git pull origin main
            
            NEW_HASH=$(git rev-parse HEAD)
            
            if [ "$OLD_HASH" = "$NEW_HASH" ]; then
              echo -e "${GREEN}✓ No new changes${NC}"
              exit 0
            fi
            
            echo -e "${GREEN}✓ Updated from $OLD_HASH to $NEW_HASH${NC}"
            
            # Backend: Install dependencies
            echo -e "\n${YELLOW}📦 Installing backend dependencies...${NC}"
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            
            # Backend: Run database migrations
            echo -e "\n${YELLOW}🗄️  Checking database migrations...${NC}"
            python scripts/apply_migrations.py
            
            # Backend: Auto-index new knowledge items
            echo -e "\n${YELLOW}🧠 Auto-indexing new knowledge items...${NC}"
            python scripts/auto_index_knowledge.py
            
            # Backend: Restart service
            echo -e "\n${YELLOW}🔄 Restarting backend service...${NC}"
            sudo systemctl restart ontrackia-backend
            
            # Frontend: Install dependencies
            echo -e "\n${YELLOW}📦 Installing frontend dependencies...${NC}"
            cd ../frontend
            npm install --silent
            
            # Frontend: Build production bundle
            echo -e "\n${YELLOW}🏗️  Building frontend...${NC}"
            npm run build
            
            # Frontend: Copy to nginx
            echo -e "\n${YELLOW}📋 Deploying to nginx...${NC}"
            sudo rm -rf /var/www/ontrackia/dist
            sudo cp -r dist /var/www/ontrackia/
            
            # Reload nginx
            echo -e "\n${YELLOW}🔄 Reloading nginx...${NC}"
            sudo nginx -t && sudo systemctl reload nginx
            
            # Health check
            echo -e "\n${YELLOW}🏥 Health check...${NC}"
            sleep 3
            
            BACKEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
            FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost)
            
            if [ "$BACKEND_STATUS" = "200" ] && [ "$FRONTEND_STATUS" = "200" ]; then
              echo -e "${GREEN}✓ Deployment successful!${NC}"
              echo -e "${GREEN}  Backend: $BACKEND_STATUS${NC}"
              echo -e "${GREEN}  Frontend: $FRONTEND_STATUS${NC}"
            else
              echo -e "${RED}✗ Deployment failed!${NC}"
              echo -e "${RED}  Backend: $BACKEND_STATUS${NC}"
              echo -e "${RED}  Frontend: $FRONTEND_STATUS${NC}"
              exit 1
            fi
            
            echo -e "\n${GREEN}========================================${NC}"
            echo -e "${GREEN}Deployment completed at $(date)${NC}"
            echo -e "${GREEN}========================================${NC}"
          ENDSSH

      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key

      - name: Notify deployment status
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed"
          fi
